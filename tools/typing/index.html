<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08070d">
  <meta name="description" content="Limitless Typing Trainer — Bookkeys, a local-first typing practice app for your own books.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src 'self'; script-src 'unsafe-inline' 'self'; style-src 'unsafe-inline' 'self'; img-src 'self' data:; font-src data:; worker-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Typing Trainer &mdash; Limitless</title>
  <link rel="stylesheet" href="../../theme.css">
  <script>
    /* set the shell theme before first paint so there is no flash (same pattern as Math Trainer) */
    (function () {
      var t = null;
      try { var nav = performance.getEntriesByType('navigation')[0]; if (nav && nav.type === 'reload') sessionStorage.removeItem('limitless.site.theme'); t = sessionStorage.getItem('limitless.site.theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    /* The shell is only a frame: Bookkeys itself runs unchanged inside the iframe below. */
    html, body { height: 100%; }
    /* dvh tracks the visible screen on phones (browser toolbars show and hide); older browsers keep 100%. */
    @supports (height: 100dvh) { html, body { height: 100dvh; } }
    /* min-height: 0 cancels theme.css's body { min-height: 100vh }, which is taller than the visible screen on phones. */
    body { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
    /* Full-screen Bookkeys: the Limitless top bar is hidden on this page only. The markup and script stay in place, so deleting this one rule brings the bar back. */
    .navbar { display: none; }
    .shell-main { flex: 1 1 auto; min-height: 0; display: flex; }
    .shell-main iframe { flex: 1 1 auto; width: 100%; height: 100%; border: 0; display: block; background: #08070d; }

    /* Theme toggle, mirroring hub-theme.css (that file is hub-wide and not loaded here). */
    .theme-toggle {
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      padding: 8px 14px;
      color: var(--gold-bright);
      background: rgba(232, 203, 139, 0.08);
      border: 1px solid var(--border);
      border-radius: 3px;
      white-space: nowrap;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .theme-toggle:hover { border-color: var(--gold); box-shadow: 0 0 10px rgba(232, 203, 139, 0.35); }
    .theme-toggle:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }

    /* Light shell chrome (mirrors the navbar overrides in hub-theme.css). */
    html[data-theme="light"] body { background: #dfe6ee; }
    html[data-theme="light"] .navbar { background: rgba(255, 255, 255, 0.55); border-bottom-color: rgba(120, 95, 40, 0.25); }
    html[data-theme="light"] .nav-links { color: #4a3a22; }
    html[data-theme="light"] .nav-links a { color: #4a3a22; }
    html[data-theme="light"] .theme-toggle { color: #4a3a22; background: rgba(120, 95, 40, 0.08); border-color: rgba(120, 95, 40, 0.35); }

    @media (max-width: 600px) {
      .theme-toggle { padding: 6px 9px; font-size: 11px; letter-spacing: .5px; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <a class="brand" href="../../">Limitless</a>
    <nav class="nav-links" aria-label="Main navigation">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme"></button>
      <a href="../../">&larr; Back to Limitless</a>
    </nav>
  </header>

  <main class="shell-main">
    <!-- The full Bookkeys application, running as its own document (identical to the standalone file). -->
    <iframe src="bookkeys.html" title="Bookkeys — Typing Trainer" loading="eager"></iframe>
  </main>

  <script type="module" src="./bookkeys-reward-bridge.mjs"></script>
  <script>
    (function () {
      var root = document.documentElement, btn = document.getElementById('theme-toggle');
      var meta = document.querySelector('meta[name="theme-color"]');
      var frame = document.querySelector('iframe');
      var framePalettes = {
        dark: { bg: '#0B0D14', panel: '#12151F', ink: '#E9E1D0', dim: '#8A8399', line: '#2C2B3A' },
        light: { bg: '#F6EFDC', panel: '#FFFAF0', ink: '#30283A', dim: '#6F6878', line: '#D9CBAE' }
      };
      function syncBookkeys() {
        try {
          var doc = frame && frame.contentDocument;
          if (!doc || !doc.documentElement) return;
          var innerRoot = doc.documentElement, palette = framePalettes[current()];
          innerRoot.setAttribute('data-theme', current());
          innerRoot.setAttribute('data-tone', current());
          Object.keys(palette).forEach(function (key) { innerRoot.style.setProperty('--' + key, palette[key]); });
          innerRoot.style.setProperty('color-scheme', current());
          // The reader shares the same site-wide artwork as every other Limitless surface.
          if (doc.body) {
            var mobile = window.matchMedia && window.matchMedia('(max-aspect-ratio: 4/5)').matches;
            var image = current() === 'light'
              ? (mobile ? '/themes/shared/limitless-light-mobile.webp' : '/themes/shared/limitless-light-desktop.webp')
              : (mobile ? '/themes/shared/limitless-dark-mobile.webp' : '/themes/shared/limitless-dark-desktop.webp');
            var veil = current() === 'light'
              ? 'linear-gradient(rgba(246,239,220,.16), rgba(246,239,220,.34)), '
              : 'linear-gradient(rgba(8,7,13,.24), rgba(8,7,13,.48)), ';
            doc.body.style.backgroundImage = veil + 'url("' + image + '")';
            doc.body.style.backgroundSize = 'cover';
            doc.body.style.backgroundPosition = 'center';
            doc.body.style.backgroundAttachment = 'fixed';
            doc.body.style.backgroundRepeat = 'no-repeat';
          }
        } catch (e) { /* The standalone frame remains usable if same-origin access is unavailable. */ }
      }
      if (frame) frame.addEventListener('load', syncBookkeys);
      function current() { return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
      function paint() {
        var other = current() === 'light' ? 'dark' : 'light';
        btn.textContent = other === 'light' ? 'Light mode' : 'Dark mode';
        btn.setAttribute('aria-label', 'Switch to ' + other + ' mode');
        if (meta) meta.setAttribute('content', current() === 'light' ? '#dfe6ee' : '#08070d');
        syncBookkeys();
      }
      btn.addEventListener('click', function () {
        var next = current() === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        try { sessionStorage.setItem('limitless.site.theme', next); } catch (e) {}
        paint();
      });
      paint();
    })();
  </script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../supabase/config.js"></script>
  <script src="../../supabase/client.js"></script>
  <script src="../../supabase/cloud-sync.js"></script>
  <script src="../../supabase/auth.js"></script>
</body>
</html>
