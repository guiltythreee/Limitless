<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d">
<title id="t">D2 hard-drawn steel wire stress strain curve</title><desc id="d">Stress strain curve from zero to ten percent strain. The wire fractures near nine percent strain and 1350 MPa.</desc>
<rect width="720" height="420" fill="#fff"/><text x="360" y="24" text-anchor="middle" font-size="18" font-family="Arial">D2 · Hard-drawn steel wire</text>
<g stroke="#d8e1e8" stroke-width="1"><path d="M70 50V350"/><path d="M128 50V350"/><path d="M186 50V350"/><path d="M244 50V350"/><path d="M302 50V350"/><path d="M360 50V350"/><path d="M418 50V350"/><path d="M476 50V350"/><path d="M534 50V350"/><path d="M592 50V350"/><path d="M650 50V350"/><path d="M70 350H650"/><path d="M70 300H650"/><path d="M70 250H650"/><path d="M70 200H650"/><path d="M70 150H650"/><path d="M70 100H650"/><path d="M70 50H650"/></g>
<path d="M70 50V350H650" fill="none" stroke="#333" stroke-width="2"/>
<polyline points="70,350 99,170 128,150 186,130 302,110 592,80" fill="none" stroke="#087080" stroke-width="4"/>
<path d="M584 72l16 16m-16 0l16 -16" stroke="#087080" stroke-width="4"/>
<g fill="#222" font-size="12" font-family="Arial"><text x="360" y="395" text-anchor="middle">Strain (%)</text><text x="20" y="200" transform="rotate(-90 20 200)" text-anchor="middle">Stress (MPa)</text>
<text x="58" y="354" text-anchor="end">0</text><text x="58" y="304" text-anchor="end">250</text><text x="58" y="254" text-anchor="end">500</text><text x="58" y="204" text-anchor="end">750</text><text x="58" y="154" text-anchor="end">1000</text><text x="58" y="104" text-anchor="end">1250</text><text x="58" y="54" text-anchor="end">1500</text>
<text x="70" y="370" text-anchor="middle">0</text><text x="128" y="370" text-anchor="middle">1</text><text x="186" y="370" text-anchor="middle">2</text><text x="244" y="370" text-anchor="middle">3</text><text x="302" y="370" text-anchor="middle">4</text><text x="360" y="370" text-anchor="middle">5</text><text x="418" y="370" text-anchor="middle">6</text><text x="476" y="370" text-anchor="middle">7</text><text x="534" y="370" text-anchor="middle">8</text><text x="592" y="370" text-anchor="middle">9</text><text x="650" y="370" text-anchor="middle">10</text></g>
<text x="420" y="158" fill="#087080" font-size="14">Fracture at 9% (×)</text></svg>