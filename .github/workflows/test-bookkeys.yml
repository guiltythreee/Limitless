name: Bookkeys Regression Tests

on:
  pull_request:
    paths:
      - "tools/typing/**"
      - "shared/**"
      - ".github/workflows/test-bookkeys.yml"
  push:
    branches: [main]
    paths:
      - "tools/typing/**"
      - "shared/**"
      - ".github/workflows/test-bookkeys.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookkeys-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/typing/tests/package-lock.json
      - name: Install test dependencies
        working-directory: tools/typing/tests
        run: npm ci
      - name: Run Bookkeys regression suite
        working-directory: tools/typing/tests
        run: npm test
