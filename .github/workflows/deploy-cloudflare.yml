name: Deploy Limitless to Cloudflare Workers

on:
  # Deploy other main-branch changes immediately. Probability source changes
  # must wait for the static export workflow so stale generated files cannot
  # be published ahead of the build.
  push:
    branches:
      - main
    paths-ignore:
      - "probability-source/**"
      - "shared/**"
      - "meta/**"
      - "tools.js"
      - ".github/workflows/build-probability.yml"
  # Build workflows commit generated static sites with GITHUB_TOKEN (which
  # does not trigger push workflows). Deploy after either build completes
  # successfully so generated Metallurgy and Probability assets are published.
  workflow_run:
    workflows:
      - "Build Probability"
      - "Metallurgy Regression Tests"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: limitless-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Bookkeys dependencies
        working-directory: tools/typing-next-source
        run: npm install --no-audit --no-fund
      - name: Build production Bookkeys app
        working-directory: tools/typing-next-source
        env:
          NEXT_PUBLIC_BOOKKEYS_BASE_PATH: /tools/typing/bookkeys-app
        run: npm run build
      - name: Stage production Bookkeys app
        run: |
          mkdir -p tools/typing/bookkeys-app
          cp -R tools/typing-next-source/out/. tools/typing/bookkeys-app/
          test -f tools/typing/bookkeys-app/index.html
          test -d tools/typing/bookkeys-app/_next
      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: "4"

# Retry deployment after refreshing the Cloudflare API token.
# Manual production deployments can also be started with workflow_dispatch.
