# Trigger automatic chapter parser refresh
name: Bookkeys chapter parser version refresh

on:
  push:
    branches:
      - fix/bookkeys-optional-section-classification-20261102
    paths:
      - .github/workflows/bookkeys-version-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bookkeys-optional-section-classification-20261102
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh version, syntax-check, and test
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'), cp=require('child_process');
          const path='tools/typing/bookkeys.html'; let html=fs.readFileSync(path,'utf8');
          const old='CHAP_VER = 3', next='CHAP_VER = 4';
          if(html.split(old).length-1!==1) throw new Error('Expected one chapter version marker');
          html=html.replace(old,next); fs.writeFileSync(path,html);
          const a=html.indexOf('/*BLOCKS-START*/'), b=html.indexOf('</script>',a);
          if(a<0||b<0) throw new Error('Application script boundaries missing');
          fs.writeFileSync('/tmp/bookkeys-app.js',html.slice(a+'/*BLOCKS-START*/'.length,b));
          cp.execFileSync(process.execPath,['--check','/tmp/bookkeys-app.js']);
          cp.execFileSync('npm',['ci'],{cwd:'tools/typing/tests',stdio:'inherit'});
          cp.execFileSync('npm',['test'],{cwd:'tools/typing/tests',stdio:'inherit'});
          cp.execFileSync('git',['config','user.name','github-actions[bot]']);
          cp.execFileSync('git',['config','user.email','41898282+github-actions[bot]@users.noreply.github.com']);
          cp.execFileSync('git',['add',path,'.github/workflows/bookkeys-version-fix.yml']);
          cp.execFileSync('git',['rm','-f','.github/workflows/bookkeys-version-fix.yml']);
          cp.execFileSync('git',['commit','-m','Refresh automatic Bookkeys chapter detection']);
          cp.execFileSync('git',['push','origin','HEAD:fix/bookkeys-optional-section-classification-20261102']);
          console.log('Chapter parser version refreshed after syntax and full regression suite passed.');
          NODE
