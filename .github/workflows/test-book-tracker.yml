name: Book Tracker Tests

on:
  pull_request:
    paths:
      - "tools/book-tracker/**"
      - ".github/workflows/test-book-tracker.yml"
  push:
    branches: [main]
    paths:
      - "tools/book-tracker/**"
      - ".github/workflows/test-book-tracker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/book-tracker/tests/test-book-tracker.mjs
      - run: node tools/book-tracker/tests/test-detect.mjs
