

name: Build Probability

on:
  push:
    branches:
      - main
    paths:
      - "probability-source/**"
      - "supabase/**"
      - "shared/**"
      - "meta/**"
      - "tools.js"
      - ".github/workflows/build-probability.yml"
  pull_request:
    paths:
      - "probability-source/**"
      - "supabase/**"
      - "shared/**"
      - "meta/**"
      - "tools.js"
      - ".github/workflows/build-probability.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: probability-source/package-lock.json

      - name: Materialize Book 02 Markdown source
        shell: bash
        run: |
          archive="probability-source/book-02-markdown-source.zip"
          target="probability-source/public/probability-books/book-02"
          if [ -f "$archive" ]; then
            rm -rf /tmp/limitless-book-02
            mkdir -p /tmp/limitless-book-02 "$target"
            unzip -q -o "$archive" -d /tmp/limitless-book-02
            source="/tmp/limitless-book-02/book2-markdown"
            test -f "$source/book.json"
            test -d "$source/chapters"
            test -d "$source/solutions"
            chapters=$(find "$source/chapters" -maxdepth 1 -type f -name 'chapter-*.md' | wc -l)
            solutions=$(find "$source/solutions" -maxdepth 1 -type f -name 'chapter-*-solutions.md' | wc -l)
            test "$chapters" -eq 13
            test "$solutions" -eq 13
            rsync -a "$source/" "$target/"
            echo "Book 02 source loaded: $chapters chapters and $solutions solution files."
          else
            echo "::notice::Book 02 source archive is not present yet; the Book 02 reader will show its missing-content state."
          fi

      - name: Install dependencies
        working-directory: probability-source
        run: npm ci

      - name: Test LSR-1 shared reward standard
        working-directory: probability-source
        run: npm run test:rewards

      - name: Test Meta dashboard and dedicated project ledger
        run: node meta/test-meta.mjs

      - name: Validate curriculum routes and question quality
        working-directory: probability-source
        run: npm run validate:curriculum

      - name: Type-check
        working-directory: probability-source
        run: npx tsc --noEmit

      - name: Build static website
        working-directory: probability-source
        run: npm run build

      - name: Verify static export
        run: |
          test -f probability-source/out/index.html
          test -d probability-source/out/_next
          test -f shared/rewards.mjs
          test -f meta/index.html
          test -f meta/meta.js
          if [ -f probability-source/book-02-markdown-source.zip ]; then
            test -f probability-source/out/probability-books/book-02/book.json
            test "$(find probability-source/out/probability-books/book-02/chapters -maxdepth 1 -type f -name 'chapter-*.md' | wc -l)" -eq 13
            test "$(find probability-source/out/probability-books/book-02/solutions -maxdepth 1 -type f -name 'chapter-*-solutions.md' | wc -l)" -eq 13
          fi
          echo "Probability export and shared Meta assets verified."

      - name: Update deployed Probability files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p probability
          rsync -a --delete probability-source/out/ probability/

      - name: Commit updated website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probability/
          if git diff --cached --quiet; then
            echo "No deployed files changed."
          else
            git commit -m "Build Probability website"
            # Another module's deployment may update main while this build runs.
            # Rebase the generated-site commit onto the latest main before pushing.
            git pull --rebase --autostash origin main
            git push
          fi
