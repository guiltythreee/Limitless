

name: Build Probability

on:
  push:
    branches:
      - main
    paths:
      - "probability-source/**"
      - ".github/workflows/build-probability.yml"
  pull_request:
    paths:
      - "probability-source/**"
      - ".github/workflows/build-probability.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: probability-source/package-lock.json

      - name: Install dependencies
        working-directory: probability-source
        run: npm ci

      - name: Validate curriculum routes and question quality
        working-directory: probability-source
        run: npm run validate:curriculum

      - name: Type-check
        working-directory: probability-source
        run: npx tsc --noEmit

      - name: Build static website
        working-directory: probability-source
        run: npm run build

      - name: Verify static export
        run: |
          test -f probability-source/out/index.html
          test -d probability-source/out/_next
          echo "Static export verified."

      - name: Update deployed Probability files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p probability
          rsync -a --delete probability-source/out/ probability/

      - name: Commit updated website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probability/
          if git diff --cached --quiet; then
            echo "No deployed files changed."
          else
            git commit -m "Build Probability website"
            git push
          fi
