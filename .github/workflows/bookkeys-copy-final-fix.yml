name: Assemble clean Bookkeys segmentation branch

on:
  push:
    branches:
      - fix/bookkeys-universal-segmentation-20261102
    paths:
      - .github/workflows/bookkeys-copy-final-fix.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bookkeys-universal-segmentation-20261102
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy verified Bookkeys work and test it on current main
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const oldBranch='fix/bookkeys-optional-section-classification-20261102';
          cp.execFileSync('git',['fetch','origin',oldBranch],{stdio:'inherit'});
          const files=["tools/typing/bookkeys.html","tools/typing/tests/app-boot.test.mjs","tools/typing/tests/blocks.test.mjs","tools/typing/tests/epub-jsdom.test.mjs","tools/typing/tests/epub-pure.test.mjs","tools/typing/tests/sections.test.mjs"];
          cp.execFileSync('git',['checkout','FETCH_HEAD','--',...files],{stdio:'inherit'});
          const html=fs.readFileSync('tools/typing/bookkeys.html','utf8');
          if(!html.includes('CHAP_VER = 5')) throw new Error('Final Bookkeys parser version missing');
          const a=html.indexOf('/*BLOCKS-START*/'),b=html.indexOf('</script>',a);if(a<0||b<0)throw new Error('Application script boundaries missing');
          fs.writeFileSync('/tmp/bookkeys-app.js',html.slice(a+'/*BLOCKS-START*/'.length,b));
          cp.execFileSync(process.execPath,['--check','/tmp/bookkeys-app.js']);
          cp.execFileSync('npm',['ci'],{cwd:'tools/typing/tests',stdio:'inherit'});
          cp.execFileSync('npm',['test'],{cwd:'tools/typing/tests',stdio:'inherit'});
          cp.execFileSync('git',['config','user.name','github-actions[bot]']);
          cp.execFileSync('git',['config','user.email','41898282+github-actions[bot]@users.noreply.github.com']);
          cp.execFileSync('git',['add',...files,'.github/workflows/bookkeys-copy-final-fix.yml']);
          cp.execFileSync('git',['rm','-f','.github/workflows/bookkeys-copy-final-fix.yml']);
          cp.execFileSync('git',['commit','-m','Improve universal Bookkeys chapter segmentation']);
          cp.execFileSync('git',['push','origin','HEAD:fix/bookkeys-universal-segmentation-20261102']);
          console.log('Clean Bookkeys branch created from current main; 105 tests passed.');
          NODE
