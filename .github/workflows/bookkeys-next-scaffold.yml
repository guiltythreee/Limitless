name: Bookkeys TypeScript Migration

on:
  pull_request:
    paths:
      - "tools/typing-next-source/**"
      - "tools/typing/**"
      - "shared/rewards.mjs"
      - ".github/workflows/bookkeys-next-scaffold.yml"
  push:
    branches:
      - work/bookkeys-typescript-migration-20261107
      - work/bookkeys-typescript-mainline-20261107
      - work/bookkeys-current-main-reconciliation-20261114
    paths:
      - "tools/typing-next-source/**"
      - "tools/typing/**"
      - "shared/rewards.mjs"
      - ".github/workflows/bookkeys-next-scaffold.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookkeys-typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Legacy Bookkeys preservation tests
        working-directory: tools/typing/tests
        run: npm ci --no-audit --no-fund && npm test
      - name: Install dependencies
        working-directory: tools/typing-next-source
        run: npm install --no-audit --no-fund
      - name: Persistence tests
        working-directory: tools/typing-next-source
        run: npm test
      - name: Type-check
        working-directory: tools/typing-next-source
        run: npm run typecheck
      - name: Build static export
        working-directory: tools/typing-next-source
        run: npm run build
      - name: Install Chromium for browser regressions
        working-directory: tools/typing-next-source
        run: npx playwright install chromium
      - name: Browser regression tests
        working-directory: tools/typing-next-source
        run: npm run e2e
      - name: Build production-path static export
        working-directory: tools/typing-next-source
        env:
          NEXT_PUBLIC_BOOKKEYS_BASE_PATH: /tools/typing/bookkeys-app
        run: npm run build
      - name: Verify production static asset paths
        working-directory: tools/typing-next-source
        run: |
          test -f out/index.html
          test -d out/_next
          grep -q '/tools/typing/bookkeys-app/_next/' out/index.html
          grep -R -q 'backgrounds/morning.webp' out/_next
